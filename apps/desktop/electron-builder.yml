appId: com.desktopcopilot.app
productName: Desktop Copilot
directories:
  output: release
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - from: ../overlay/dist
    to: overlay
    filter:
      - "**/*"
  - from: resources
    to: resources
    filter:
      - "**/*"
  - from: ../../.env
    to: .env
extraResources:
  - from: ../../.env
    to: .env
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Desktop Copilot
  uninstallDisplayName: Desktop Copilot
  deleteAppDataOnUninstall: false
  runAfterFinish: true
